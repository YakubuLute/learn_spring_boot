# Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Start the database first:  docker compose up -d   (see compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5433/tododb
spring.datasource.username=${DB_USERNAME:todo}
spring.datasource.password=${DB_PASSWORD:todo}
# "update" keeps your data between restarts (use Flyway/Liquibase migrations in real projects)
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
