spring.application.name=spring_todo

# ---------- SESSION 3: Database (H2 in-memory, zero setup) ----------
spring.datasource.url=jdbc:h2:mem:tododb
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates the tables from our @Entity classes at startup and drops them at shutdown
spring.jpa.hibernate.ddl-auto=create-drop
# Print every SQL statement Hibernate runs — great for learning, noisy in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Browse the database at http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:tododb, user: sa)
spring.h2.console.enabled=true

# ---------- SESSION 5: Rate limiting (our own property, see RateLimitProperties) ----------
app.rate-limit.enabled=true

# ---------- SESSION 6: GraphQL ----------
# Playground UI at http://localhost:8080/graphiql
spring.graphql.graphiql.enabled=true
